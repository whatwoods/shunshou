    <div style="display: flex; gap: 20px; margin-top: 18px; flex-wrap: wrap;">

            <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #F0442E; box-shadow: 0 0 6px rgba(240,68,46,0.8);"></span>
            <span style="flex: 1 1 auto;"><span style="font-weight: 600;">第 1 行第 52 列</span> · <code style="font-family: ui-monospace, 'SF Mono', Menlo, monospace;">true</code> 后面少了一个逗号</span>
            <button type="button" style="border: 0; padding: 0; background: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; color: #1F4FD1;">帮我补上</button>

      <section aria-label="输出" style="position: relative; flex: 1 1 520px; min-width: 0; height: 540px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 22px; background: #FFFFFF; overflow: hidden;">
        <div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 18px; box-shadow: inset 0 -0.5px 0 rgba(60,58,54,0.18);">

<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["valid","error"],"default":"valid"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  state = { mode: 'pretty', indent: '2', sort: false };

  // 真折射依赖 backdrop-filter: url(#svg滤镜)，目前只有 Chromium 支持；其他浏览器退回普通模糊
  refractOK() {
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    return /Chrome\/\d+/.test(ua) && !/Firefox\//.test(ua);
  }

  sortKeys(v) {
    if (Array.isArray(v)) return v.map((x) => this.sortKeys(x));
    if (v && typeof v === 'object') {
      const o = {};
      Object.keys(v).sort().forEach((k) => { o[k] = this.sortKeys(v[k]); });
      return o;
    }
    return v;
  }

  // 浅色底上的语法配色：键名用钴蓝，其余颜色都压到 4.5:1 以上
  tokens(line) {
    const KEY = '#1F4FD1', STR = '#1B7A36', NUM = '#A55400', LIT = '#7A3FD1', PUN = '#77746F';
    const out = [];
    const re = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|(true|false|null)|([{}\[\],])|(\s+)/g;
    let m;
    while ((m = re.exec(line))) {
      if (m[1] && m[2]) { out.push({ t: m[1], c: KEY }); out.push({ t: m[2] + ' ', c: PUN }); }
      else if (m[1]) out.push({ t: m[1], c: STR });
      else if (m[3]) out.push({ t: m[3], c: NUM });
      else if (m[4]) out.push({ t: m[4], c: LIT });
      else if (m[5]) out.push({ t: m[5], c: PUN });
      else if (m[6]) out.push({ t: m[6], c: PUN });
    }
    return out;
  }

  renderVals() {
    const s = this.state || {};
    const mode = s.mode || 'pretty';
    const indent = s.indent || '2';
    const sort = !!s.sort;
    const isError = (this.props.variant ?? 'valid') === 'error';

    const raw = '{"name":"shunshou","version":"1.0.0","private":true,"scripts":{"dev":"vite","build":"vite build","deploy":"wrangler deploy"},"tools":[{"id":"image-compress","category":"image","wasm":true},{"id":"pdf-merge","category":"pdf","wasm":true},{"id":"json-format","category":"code","wasm":false}],"offline":true,"telemetry":null}';
    const cut = raw.indexOf('"private":true,') + '"private":true'.length;
    const inBefore = isError ? raw.slice(0, cut - 4) : raw;
    const inMark = isError ? 'true ' : '';
    const inAfter = isError ? raw.slice(cut + 1) : '';

    let obj = JSON.parse(raw);
    if (sort) obj = this.sortKeys(obj);
    const space = indent === 'tab' ? '\t' : Number(indent);
    const text = mode === 'min' ? JSON.stringify(obj) : JSON.stringify(obj, null, space);
    const outLines = text.split('\n');
    const lines = outLines.map((l, i) => ({ n: String(i + 1), parts: this.tokens(l.replace(/\t/g, '    ')) }));

    const kb = (n) => (n / 1024).toFixed(1) + ' KB';
    const enc = (str) => new TextEncoder().encode(str).length;

    const seg = (list, cur, key) => list.map((o) => {
      const on = o.id === cur;
      return {
        ...o,
        pressed: on ? 'true' : 'false',
        weight: on ? '600' : '400',
        bg: on ? '#FFFFFF' : 'transparent',
        shadow: on ? '0 3px 8px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04)' : 'none',
        pick: () => this.setState({ [key]: o.id })
      };
    });

    const lg = this.refractOK();
    return {
      isError,
      isValid: !isError,
      inBefore, inMark, inAfter,
      errBg: isError ? 'rgba(240,68,46,0.14)' : 'transparent',
      errRing: isError ? '0 0 0 1.5px #E2481F' : 'none',
      lines,
      wrap: mode === 'min' ? 'pre-wrap' : 'pre',
      stats: isError ? '—' : outLines.length + ' 行',
      statusText: isError ? '出错' : '有效',
      statusNote: isError ? '第 1 行第 52 列' : kb(enc(raw)) + ' → ' + kb(enc(text)),
      // A 留下的痕迹：校验结果用 LED 小灯表示
      statusLed: isError ? '#F0442E' : '#22B35E',
      statusGlow: isError ? '0 0 6px rgba(240,68,46,0.8)' : '0 0 6px rgba(34,179,94,0.8)',
      modes: seg([{ id: 'pretty', label: '格式化' }, { id: 'min', label: '压缩成一行' }], mode, 'mode'),
      indents: seg([{ id: '2', label: '2 空格' }, { id: '4', label: '4 空格' }, { id: 'tab', label: 'Tab' }], indent, 'indent'),
      sortChecked: sort ? 'true' : 'false',
      sortAlign: sort ? 'flex-end' : 'flex-start',
      sortTrack: sort ? '#34C759' : 'rgba(120,116,108,0.18)',
      toggleSort: () => this.setState({ sort: !sort }),
      navFilter: lg ? 'url(#lgNav) saturate(160%) brightness(1.04)' : 'blur(16px) saturate(180%)',
      tagFilter: lg ? 'url(#lgTag) saturate(150%) brightness(1.05)' : 'blur(10px) saturate(170%)'
    };
  }
}
</script>
