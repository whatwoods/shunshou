<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  state = { view: 'page', a4: true, bookmarks: false, name: '报销材料-10月' };

  // 真折射依赖 backdrop-filter: url(#svg滤镜)，目前只有 Chromium 支持；其他浏览器退回普通模糊
  refractOK() {
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
    return /Chrome\/\d+/.test(ua) && !/Firefox\//.test(ua);
  }

  renderVals() {
    const s = this.state || {};
    const view = s.view || 'page';
    const a4 = s.a4 !== false;
    const bm = !!s.bookmarks;

    // 每个来源一个 LED 颜色（A 留下的痕迹）
    const A = '#F5A524', B = '#3B82F6', P = '#22B35E';
    const TEXT = 'repeating-linear-gradient(180deg, rgba(29,29,31,0.13) 0 3px, rgba(29,29,31,0) 3px 11px)';
    const TABLE = 'linear-gradient(rgba(29,29,31,0.08), rgba(29,29,31,0.08)) 0 0 / 100% 18% no-repeat, repeating-linear-gradient(180deg, rgba(29,29,31,0.12) 0 1px, rgba(29,29,31,0) 1px 14px)';
    const PHOTO = 'radial-gradient(120% 55% at 28% 100%, #4E6B5A 0 50%, rgba(78,107,90,0) 51%), linear-gradient(180deg, #C7D6DF 0%, #E6ECEE 100%)';
    const page = (led, n, label, kind) => ({
      led, n, label,
      isText: kind !== 'photo' && kind !== 'slot',
      isPhoto: kind === 'photo',
      isSlot: kind === 'slot',
      lines: kind === 'table' ? TABLE : TEXT,
      photo: PHOTO,
      paper: kind === 'slot' ? 'rgba(31,79,209,0.05)' : '#FFFFFF',
      paperShadow: kind === 'slot' ? 'none' : '0 0 0 0.5px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.06)',
      slot: kind === 'slot' ? '1.5px dashed #1F4FD1' : 'none',
      labelColor: kind === 'slot' ? '#1F4FD1' : '#1D1D1F'
    });
    const pages = [
      page(A, '01', '报销单 · 1'),
      page(P, '02', 'IMG_2048', 'photo'),
      page('#1F4FD1', '03', '报销单 · 2', 'slot'),
      page(A, '04', '报销单 · 3'),
      page(A, '05', '报销单 · 4'),
      page(A, '06', '报销单 · 5'),
      page(B, '07', '发票 · 1', 'table'),
      page(B, '08', '发票 · 2', 'table'),
      page(P, '09', 'IMG_2051', 'photo'),
      page(A, '10', '报销单 · 6')
    ];
    const docsRaw = [
      { name: '报销单.pdf', led: A, meta: '6 页 · 1.6 MB', face: TEXT, stack: '1' },
      { name: '发票.pdf', led: B, meta: '2 页 · 420 KB', face: TABLE, stack: '1' },
      { name: 'IMG_2048.HEIC', led: P, meta: '图片 → 1 页', face: PHOTO, stack: '0' },
      { name: 'IMG_2051.HEIC', led: P, meta: '图片 → 1 页', face: PHOTO, stack: '0' }
    ];
    const docs = docsRaw.map((d, i) => ({ ...d, rule: i < docsRaw.length - 1 ? 'inset 0 -0.5px 0 rgba(60,58,54,0.2)' : 'none' }));

    const views = [{ id: 'file', label: '按文件' }, { id: 'page', label: '按页面' }].map((v) => {
      const on = v.id === view;
      return {
        ...v,
        pressed: on ? 'true' : 'false',
        weight: on ? '600' : '400',
        bg: on ? '#FFFFFF' : 'transparent',
        shadow: on ? '0 3px 8px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04)' : 'none',
        pick: () => this.setState({ view: v.id })
      };
    });

    const lg = this.refractOK();
    return {
      pages,
      docs,
      views,
      byPage: view === 'page',
      byFile: view === 'file',
      outName: s.name ?? '报销材料-10月',
      onName: (e) => this.setState({ name: e.target.value }),
      a4Checked: a4 ? 'true' : 'false',
      a4Align: a4 ? 'flex-end' : 'flex-start',
      a4Track: a4 ? '#34C759' : 'rgba(120,116,108,0.18)',
      toggleA4: () => this.setState({ a4: !a4 }),
      bmChecked: bm ? 'true' : 'false',
      bmAlign: bm ? 'flex-end' : 'flex-start',
      bmTrack: bm ? '#34C759' : 'rgba(120,116,108,0.18)',
      toggleBm: () => this.setState({ bookmarks: !bm }),
      navFilter: lg ? 'url(#lgNav) saturate(160%) brightness(1.04)' : 'blur(16px) saturate(180%)',
      toolFilter: lg ? 'url(#lgTool) saturate(150%) brightness(1.05)' : 'blur(12px) saturate(170%)'
    };
  }
}
</script>
</body>
</html>
